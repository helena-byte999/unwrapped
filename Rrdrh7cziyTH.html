const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(blob, pw) {
  const raw = b64(blob), salt = raw.slice(0, 16), iv = raw.slice(16, 28), body = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, body));
}
let pages = null;
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value.trim().toLowerCase(), err = document.getElementById('err');
  err.textContent = 'Unlocking…';
  try { pages = { light: await unlock(DATA.light, pw), night: await unlock(DATA.night, pw) }; }
  catch (x) { err.textContent = 'That password doesn\'t match. Check the message from Ena.'; return; }
  document.getElementById('f').hidden = true; document.getElementById('choose').hidden = false;
};
const go = t => { document.open(); document.write(pages[t]); document.close(); };
document.getElementById('l').onclick = () => go('light');
document.getElementById('n').onclick = () => go('night');
